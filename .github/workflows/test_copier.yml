name: Test Copier
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copier-copy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        font_style: [sans, serif]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - env:
          FONT_STYLE: ${{ matrix.font_style }}
        run: |
          uvx copier copy . my-talk \
            --vcs-ref HEAD \
            --defaults \
            --data project_name=my-talk \
            --data deck_title="My talk" \
            --data author_name="Jane Doe" \
            --data font_style="$FONT_STYLE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-talk-${{ matrix.font_style }}
          path: my-talk
          include-hidden-files: true
  compile:
    runs-on: ubuntu-latest
    needs: copier-copy
    strategy:
      matrix:
        font_style: [sans, serif]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: my-talk-${{ matrix.font_style }}
          path: my-talk
      - uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5.3
        with:
          typst-version: 0.15.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - working-directory: my-talk
        run: just build
  scaffold-pre-commit:
    runs-on: ubuntu-latest
    needs: copier-copy
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: my-talk-sans
          path: my-talk
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - working-directory: my-talk
        run: |
          git init -q
          just agent-skills
          test -f .agents/skills/touying-author/SKILL.md
          test -f .claude/skills/seaslides-typst-slides-skill/SKILL.md
          git add .
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 0.5.0
          working-directory: my-talk
